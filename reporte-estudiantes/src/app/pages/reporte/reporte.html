<div class="container mt-4">
  <h2 class="mb-3">Reporte de estudiantes</h2>

  <div *ngIf="cargando" class="alert alert-info">
    Cargando estudiantes...
  </div>

  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <div *ngIf="!cargando && !error">
    <table class="table table-striped table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>Nombre</th>
          <th>Nota 1</th>
          <th>Nota 2</th>
          <th>Nota 3</th>
          <th>Acción</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let e of estudiantes">
          <td>{{ e.nombre }}</td>
          <td>{{ e.nota1 }}</td>
          <td>{{ e.nota2 }}</td>
          <td>{{ e.nota3 }}</td>
          <td>
            <a
              class="btn btn-primary btn-sm"
              [routerLink]="['/detalle', e.id]">
              Detalle
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
